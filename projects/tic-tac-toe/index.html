<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css?v=20260926-1">
  <link rel="stylesheet" href="../../dashboard.css?v=20260926-4">
  <link rel="stylesheet" href="../../theme.css?v=20260926-5">
  <script src="../../project-host.js?v=20260926-2" defer></script>
</head>
<body class="project-page">
  <nav class="site-nav" aria-label="Main navigation">
    <button class="hub-link" type="button" data-project-home>
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 10.5 12 4l8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-8Z"></path>
        <path d="M9.5 20v-6h5v6"></path>
      </svg>
      Home
    </button>
  </nav>
  <main class="shell">
    <section class="game">
      <header class="game-toolbar">
        <div class="match-copy">
          <span class="round" id="round-label">Round 1</span>
          <p class="status" id="status">Player X's turn</p>
        </div>
        <button class="reset" id="reset" type="button">New Game</button>
      </header>

      <section class="board" id="board" aria-label="Tic Tac Toe board"></section>

      <section class="scoreboard" aria-label="Player markers">
        <div class="score-card is-active" id="card-x">
          <span class="score-mark">X</span>
          <span class="score-label">Player X</span>
          <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score-card" id="card-o">
          <span class="score-mark">O</span>
          <span class="score-label">Player O</span>
          <span class="score-value" id="score-o">0</span>
        </div>
      </section>

      <section class="insights" aria-label="Game insights">
        <div class="insight-card">
          <span class="insight-label">Draws</span>
          <span class="insight-value" id="score-draw">0</span>
        </div>
        <div class="insight-card">
          <span class="insight-label">Moves</span>
          <span class="insight-value" id="move-count">0</span>
        </div>
        <div class="insight-card">
          <span class="insight-label">Streak</span>
          <span class="insight-value" id="streak-label">None</span>
        </div>
      </section>

    </section>
  </main>
  <script src="script.js?v=20260926-1"></script>
</body>
</html>
