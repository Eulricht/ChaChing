<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Hub</title>
  <link rel="stylesheet" href="dashboard.css?v=20260923-1">
</head>
<body class="dashboard-page">
  <main class="dashboard">
    <header class="dashboard-header">
      <p class="hub-eyebrow">The collection</p>
      <h1>Project Hub<span>.</span></h1>
      <p class="hub-description">Games, experiments, and whatever comes next. Pick a project to get started.</p>
    </header>
    <section aria-labelledby="projects-title">
      <div class="section-heading">
        <h2 id="projects-title">Projects</h2>
        <span>01 ready / 01 upcoming</span>
      </div>
      <div class="project-grid">
        <a class="project-card" href="tic-tac-toe.html">
          <div class="project-meta"><span>01 / Strategy</span><span class="project-badge">Ready to play</span></div>
          <div class="project-symbol" aria-hidden="true">X <span>O</span></div>
          <h3>Tic Tac Toe</h3>
          <p>Nine squares. Two players. Make your next move count.</p>
          <span class="project-action">Open game <span aria-hidden="true">&nearr;</span></span>
        </a>
        <button class="project-card upcoming-project" type="button" disabled>
          <span class="project-meta"><span>02 / Speed</span><span class="project-badge">Coming soon</span></span>
          <span class="project-symbol typing-symbol" aria-hidden="true">Aa<span>_</span></span>
          <span class="project-title">Typing Game</span>
          <span class="project-description">A new challenge for your speed and accuracy. In the works.</span>
          <span class="project-action">Coming soon <span aria-hidden="true">&middot;&middot;&middot;</span></span>
        </button>
      </div>
    </section>
    <footer class="dashboard-footer">A small collection. Room to grow.</footer>
  </main>
</body>
</html>
