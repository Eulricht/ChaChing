<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss.exe</title>
  <link rel="icon" href="assets/swiss-mark.svg?v=3" type="image/svg+xml">
  <link rel="stylesheet" href="dashboard.css?v=20261001-5">
  <link rel="stylesheet" href="theme.css?v=20261001-2">
  <script src="shell.js?v=20261001-3" defer></script>
</head>
<body class="dashboard-page">
  <nav class="site-nav shell-nav" aria-label="Main navigation">
    <button class="hub-link" id="shell-home" type="button" aria-current="page">
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 10.5 12 4l8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-8Z"></path>
        <path d="M9.5 20v-6h5v6"></path>
      </svg>
      Home
    </button>
  </nav>
  <div class="app-view is-active" id="dashboard-view">
    <main class="dashboard">
      <header class="brand-lockup">
        <img class="brand-mark" src="assets/swiss-mark.svg" alt="">
        <h1>Swiss<span>.exe</span></h1>
        <svg class="brand-knife" viewBox="0 0 128 82" aria-hidden="true">
          <g class="knife-blade knife-fold">
            <path d="M47 47 9 30Q11 44 27 49L45 54Z"/>
            <path class="knife-engraving" d="M21 38Q29 38 36 44Q28 42 21 38Z"/>
          </g>
          <g class="knife-opener knife-fold">
            <path d="m47 48-9-24-10-7-7 3 4 8 5-2 4 9 6 16Z"/>
          </g>
          <g class="knife-corkscrew knife-fold">
            <path d="m80 50 7 6c8 0 11 6 4 7s-8-4-2-5 13 5 7 8-10-2-4-4 13 4 8 7l-2 4"/>
          </g>
          <g class="knife-scissors knife-fold">
            <path d="m82 52 8-9m1-4 7-11 8-19q-1 18-7 26l-5 9m2 2 3-11 20-10q-6 13-18 16l-2 5"/>
            <ellipse cx="90" cy="44" rx="4" ry="5" transform="rotate(25 90 44)"/>
            <ellipse cx="98" cy="49" rx="5" ry="4" transform="rotate(-25 98 49)"/>
            <circle cx="99" cy="35" r="1.3"/>
          </g>
          <rect class="knife-handle" x="39" y="46" width="50" height="13" rx="6.5"/>
          <circle class="knife-pivot" cx="46" cy="52.5" r="2"/>
          <path class="knife-detail" d="M55 52.5h17"/>
          <circle class="knife-pivot" cx="82" cy="52.5" r="1.8"/>
        </svg>
      </header>
      <section aria-label="Projects">
        <div class="project-grid">
          <button class="project-card" type="button" data-project="tic-tac-toe">
            <div class="project-symbol" aria-hidden="true">X <span>O</span></div>
            <h3>Tic Tac Toe</h3>
            <p>A classic for two players.</p>
          </button>
          <button class="project-card" type="button" data-project="typing">
            <span class="project-symbol typing-symbol" aria-hidden="true"><span class="accent-letter">A</span>a<span>_</span></span>
            <span class="project-title">Typing Game</span>
            <span class="project-description">Find your rhythm. Test your speed.</span>
          </button>
          <button class="project-card" type="button" data-project="reaction">
            <span class="project-symbol reaction-symbol" aria-hidden="true"><span>184</span><small>ms</small></span>
            <span class="project-title">Reaction Time</span>
            <span class="project-description">Wait for the signal. React instantly.</span>
          </button>
          <button class="project-card" type="button" data-project="dice">
            <svg class="project-symbol dice-symbol" viewBox="0 0 60 60" aria-hidden="true"><rect x="5" y="5" width="50" height="50" rx="12"/><circle cx="19" cy="19" r="3"/><circle cx="41" cy="19" r="3"/><circle cx="30" cy="30" r="3"/><circle cx="19" cy="41" r="3"/><circle cx="41" cy="41" r="3"/></svg>
            <span class="project-title">Dice Roller</span>
            <span class="project-description">A little chance. A clean roll.</span>
          </button>
        </div>
      </section>
    </main>
  </div>
  <section class="project-frame-view app-view" id="project-view" aria-label="Current project" hidden>
    <iframe class="project-frame" id="project-frame" title="Project"></iframe>
  </section>
</body>
</html>
