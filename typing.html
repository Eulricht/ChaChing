<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing / Project Hub</title>
  <link rel="stylesheet" href="dashboard.css?v=20260923-2">
  <link rel="stylesheet" href="theme.css?v=20260924-1">
  <link rel="stylesheet" href="typing.css?v=20260924-1">
  <script src="typing.js?v=20260924-1" defer></script>
</head>
<body class="project-page">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="hub-link" href="index.html"><span aria-hidden="true">&larr;</span> Project Hub</a>
    <span class="nav-location">Typing</span>
  </nav>
  <main class="typing-main">
    <header class="typing-heading"><p class="hub-eyebrow">Find your flow</p><h1>Just type.</h1><p>Small words. A clear mind. Your own pace.</p></header>
    <div class="typing-toolbar">
      <span>time / english</span>
      <div class="durations" role="group" aria-label="Test duration">
        <button type="button" data-seconds="15" aria-pressed="false">15s</button>
        <button type="button" data-seconds="30" aria-pressed="true">30s</button>
        <button type="button" data-seconds="60" aria-pressed="false">60s</button>
      </div>
    </div>
    <div class="typing-stats" aria-label="Test statistics">
      <span><strong id="time">30</strong> seconds</span>
      <span><strong id="wpm">0</strong> wpm</span>
      <span><strong id="accuracy">100</strong>% accuracy</span>
    </div>
    <div class="word-window" id="word-window"><div id="words" aria-label="Text to type"></div></div>
    <label class="input-label" for="typing-input">Type the words above, including spaces</label>
    <input id="typing-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Start typing here..." aria-describedby="typing-status">
    <div class="typing-footer"><p id="typing-status" role="status">The timer starts with your first character.</p><button id="restart" type="button">Restart &crarr;</button></div>
    <p class="typing-note">Backspace to correct a mistake. Speed uses correct characters / 5 per minute.</p>
  </main>
</body>
</html>
